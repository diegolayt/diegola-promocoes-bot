name: Publicar promoções femininas

on:
  workflow_dispatch:

concurrency:
  group: publicar-feminino
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_MESSAGE_THREAD_ID: "958025"
      STATE_NAMESPACE: feminino
      KEYWORDS: vestido feminino,lingerie feminina,maquiagem,bolsa feminina,acessórios femininos,saia feminina,blusa feminina,calça feminina,tênis feminino,perfume feminino
      FOCUS_TERMS: vestido,lingerie,sutiã,calcinha,maquiagem,batom,base facial,máscara de cílios,bolsa,acessórios,saia,blusa,calça,tênis,perfume
      REQUIRED_TERMS: feminino,feminina,mulher
      EXCLUDED_TERMS: masculino,masculina,infantil,bebê,bebe,unissex,mesa,boia,brinquedo,papelaria,réplica,replica,inspirado,inspirada,1:1,um pra um,primeira linha
      MIN_DISCOUNT_PERCENT: "10"
      MIN_COMMISSION_PERCENT: "1"
      MIN_PRICE: "19.99"
      POSTS_PER_CYCLE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Reservar uma oferta feminina
        run: npm run reserve

      - name: Salvar reserva antes de enviar ao Telegram
        run: |
          git config user.name "Diegola Promoções Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m "Reserva oferta feminina"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort || true
              sleep $((attempt * 2))
            done
            exit 1
          fi

      - name: Publicar a oferta feminina
        run: npm run publish-reserved

      - name: Confirmar publicação
        run: |
          git config user.name "Diegola Promoções Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m "Confirma publicação feminina"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort || true
              sleep $((attempt * 2))
            done
            exit 1
          fi
