name: Vitrine Mercado Livre

# Monta a lista dos melhores produtos de cada categoria para o site de ofertas.
# Não publica nada no Telegram.
on:
  workflow_dispatch:
  schedule:
    - cron: "20 9,21 * * *"

concurrency:
  group: vitrine-mercadolivre
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  vitrine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Montar a vitrine
        run: node src/mercadolivre.mjs --vitrine
        env:
          MERCADOLIVRE_CLIENT_ID: ${{ secrets.MERCADOLIVRE_CLIENT_ID }}
          MERCADOLIVRE_CLIENT_SECRET: ${{ secrets.MERCADOLIVRE_CLIENT_SECRET }}
          MERCADOLIVRE_MATT_WORD: ${{ secrets.MERCADOLIVRE_MATT_WORD }}
          MERCADOLIVRE_MATT_TOOL: ${{ secrets.MERCADOLIVRE_MATT_TOOL }}

      # Só o arquivo da vitrine entra no commit: o token e o histórico de
      # publicações pertencem à rodada do Telegram.
      - name: Salvar a vitrine
        run: |
          if [ ! -f data/vitrine.mercadolivre.json ]; then exit 0; fi
          git config user.name "Diegola Promoções Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vitrine.mercadolivre.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza vitrine Mercado Livre"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort || true
              sleep $((attempt * 2))
            done
            exit 1
          fi
