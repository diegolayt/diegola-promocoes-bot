name: Publicar promoções

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Impede duas execuções de escolherem e publicarem a mesma oferta antes que
# o histórico data/posted.json seja salvo no repositório.
concurrency:
  group: publicar-promocoes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Uma execução que ficou na fila deve usar o histórico mais recente,
          # e não o commit que existia quando o agendamento foi criado.
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Reservar uma oferta antes da publicação
        run: npm run reserve
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KEYWORDS: camiseta masculina,camisa masculina,blusa masculina,bermuda masculina,calça masculina,tênis masculino,relógio masculino,carteira masculina,boné masculino,perfume masculino,smartphone,notebook,fone bluetooth,headset,teclado gamer,mouse gamer,caixa de som,smartwatch,monitor,ssd
          FOCUS_TERMS: masculino,perfume,fragrância,smartphone,celular,notebook,fone,headset,teclado,mouse,gamer,smartwatch,relógio,monitor,ssd,memória,caixa de som,bluetooth,console,carregador,power bank,blusa
          MIN_DISCOUNT_PERCENT: "10"
          MIN_COMMISSION_PERCENT: "1"
          POSTS_PER_CYCLE: "1"

      - name: Salvar reserva antes de enviar ao Telegram
        run: |
          git config user.name "Diegola Promoções Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          # Mantém as novas ofertas desta execução e une com qualquer histórico
          # que tenha chegado ao repositório enquanto ela aguardava na fila.
          git reset origin/main
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            import { readFile, writeFile } from "node:fs/promises";
            const local = JSON.parse(await readFile("data/posted.json", "utf8"));
            let remote = [];
            try { remote = JSON.parse(execFileSync("git", ["show", "origin/main:data/posted.json"], { encoding: "utf8" })); } catch {}
            await writeFile("data/posted.json", JSON.stringify([...new Set([...remote, ...local])], null, 2) + "\\n");
          '
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m "Reserva oferta para publicação"
            git push origin HEAD:main
          fi

      - name: Publicar a oferta reservada
        run: npm run publish-reserved
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Confirmar publicação sem reabrir a reserva
        run: |
          git config user.name "Diegola Promoções Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset origin/main
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m "Confirma publicação da oferta"
            git push origin HEAD:main
          fi
