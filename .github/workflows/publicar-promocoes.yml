name: Publicar promoções

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Impede duas execuções de escolherem e publicarem a mesma oferta antes que
# o histórico data/posted.json seja salvo no repositório.
concurrency:
  group: publicar-promocoes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Buscar e publicar uma oferta
        run: npm run once
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KEYWORDS: camiseta masculina,camisa masculina,bermuda masculina,calça masculina,tênis masculino,relógio masculino,carteira masculina,boné masculino,perfume masculino,smartphone,notebook,fone bluetooth,headset,teclado gamer,mouse gamer,smartwatch,monitor,ssd
          FOCUS_TERMS: masculino,perfume,fragrância,smartphone,celular,notebook,fone,headset,teclado,mouse,gamer,smartwatch,relógio,monitor,ssd,memória,caixa de som,bluetooth,console,carregador,power bank
          MIN_DISCOUNT_PERCENT: "10"
          MIN_COMMISSION_PERCENT: "1"
          POSTS_PER_CYCLE: "1"

      - name: Salvar controle de ofertas já publicadas
        run: |
          git config user.name "Diegola Promoções Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posted.json
          git diff --cached --quiet || git commit -m "Atualiza ofertas publicadas"
          git pull --rebase origin main
          git push
