name: Publicar promoções

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Impede duas execuções de escolherem e publicarem a mesma oferta antes que
# o histórico data/posted.json seja salvo no repositório.
concurrency:
  group: publicar-promocoes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Uma execução que ficou na fila deve usar o histórico mais recente,
          # e não o commit que existia quando o agendamento foi criado.
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Reservar uma oferta antes da publicação
        run: npm run reserve
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KEYWORDS: camiseta masculina,camisa masculina,moletom masculino,casaco masculino,jaqueta masculina,bermuda masculina,calça masculina,tênis masculino,relógio masculino,carteira masculina,boné masculino,cinto masculino,bolsa masculina,mochila masculina,perfume masculino
          FOCUS_TERMS: camiseta,camisa,moletom,casaco,jaqueta,bermuda,calça,tênis,relógio,carteira,boné,cinto,bolsa,mochila,perfume
          REQUIRED_TERMS: masculino,masculina,homem
          EXCLUDED_TERMS: feminino,feminina,infantil,bebê,bebe,unissex,mesa,boia,brinquedo,papelaria,réplica,replica,inspirado,inspirada,1:1,um pra um,primeira linha
          MIN_DISCOUNT_PERCENT: "10"
          MIN_COMMISSION_PERCENT: "1"
          MIN_PRICE: "19.99"
          POSTS_PER_CYCLE: "1"

      - name: Salvar reserva antes de enviar ao Telegram
        run: |
          git config user.name "Diegola Promoções Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m "Reserva oferta para publicação"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort || true
              sleep $((attempt * 2))
            done
            exit 1
          fi

      - name: Publicar a oferta reservada
        run: npm run publish-reserved
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Confirmar publicação sem reabrir a reserva
        run: |
          git config user.name "Diegola Promoções Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m "Confirma publicação da oferta"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort || true
              sleep $((attempt * 2))
            done
            exit 1
          fi
