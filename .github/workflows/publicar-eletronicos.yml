name: Publicar promoções de eletrônicos

on:
  workflow_dispatch:

concurrency:
  group: publicar-eletronicos
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_MESSAGE_THREAD_ID: "958021"
      STATE_NAMESPACE: eletronicos
      KEYWORDS: smartphone,notebook,tablet,teclado gamer,mouse gamer,headset,caixa de som,playstation,xbox,smart tv,monitor,air fryer,sanduicheira,cafeteira,roteador,impressora,câmera de segurança,projetor,micro-ondas,geladeira,máquina de lavar,robô aspirador
      FOCUS_TERMS: smartphone,celular,notebook,tablet,teclado,mouse,webcam,fone,headset,caixa de som,bluetooth,console,controle,gamepad,smart tv,televisão,televisao,air fryer,fritadeira,aspirador,robô aspirador,robo aspirador,forno elétrico,forno eletrico,liquidificador,ventilador,monitor,ssd,memória,cartão de memória,carregador,power bank,powerbank,sanduicheira,grill elétrico,grill eletrico,cafeteira,roteador,repetidor wifi,impressora,câmera de segurança,camera de seguranca,projetor,micro-ondas,microondas,geladeira,frigobar,máquina de lavar,maquina de lavar,lava e seca
      EXCLUDED_TERMS: mesa,boia,brinquedo,infantil,bebê,bebe,papelaria,mochila,mochla,backpack,bolsa,medidor de pressão,medidor de pressao,pressão arterial,pressao arterial,esfigmomanômetro,esfigmomanometro,réplica,replica,inspirado,inspirada,1:1,um pra um,primeira linha
      MIN_DISCOUNT_PERCENT: "10"
      MIN_COMMISSION_PERCENT: "1"
      MIN_PRICE: "19.99"
      POSTS_PER_CYCLE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Reservar uma oferta de eletrônicos
        run: npm run reserve

      - name: Salvar reserva antes de enviar ao Telegram
        run: |
          git config user.name "Diegola Promoções Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m "Reserva oferta de eletrônicos"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort || true
              sleep $((attempt * 2))
            done
            exit 1
          fi

      - name: Publicar a oferta de eletrônicos
        run: npm run publish-reserved

      - name: Confirmar publicação
        run: |
          git config user.name "Diegola Promoções Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m "Confirma publicação de eletrônicos"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort || true
              sleep $((attempt * 2))
            done
            exit 1
          fi
