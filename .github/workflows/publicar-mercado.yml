name: Publicar promoções de mercado

on:
  workflow_dispatch:

concurrency:
  group: publicar-mercado
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_MESSAGE_THREAD_ID: "958026"
      STATE_NAMESPACE: mercado
      KEYWORDS: biscoito,traquinas,passatempo,pringles,chocolate,nutella,salgadinho,lays,energético,whey protein,creatina,omo,amaciante,desinfetante,detergente
      FOCUS_TERMS: biscoito,bolacha,cookie,traquinas,passatempo,oreo,chocolate,bombom,kitkat,nutella,creme de avelã,salgadinho,cheetos,doritos,lays,pringles,elma chips,energético,red bull,monster,whey,creatina,barra de proteína,refrigerante,suco,café,sabão,sabao,omo,amaciante,comfort,downy,detergente,desinfetante,água sanitária,agua sanitaria,multiuso,limpeza
      EXCLUDED_TERMS: arroz,feijão,macarrão,farinha,infantil,bebê,bebe,brinquedo,papelaria,mesa,boia,saco,sacolé,sacole,saquinho,embalagem,descartável,pote,copo,forma,molde,canudo,utensílio,kit para fazer,biquíni,bikini,sandália,sandalia,sapato,tênis,tenis,calçado,calcado,vestido,lingerie,calcinha,sutiã,sutia,blusa,camisa,camiseta,calça,calca,shorts,bermuda,bolsa,mochila,boné,bone,brinco,colar,pulseira
      MIN_DISCOUNT_PERCENT: "10"
      MIN_COMMISSION_PERCENT: "1"
      POSTS_PER_CYCLE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Reservar uma oferta de mercado
        run: npm run reserve

      - name: Salvar reserva antes de enviar ao Telegram
        run: |
          git config user.name "Diegola Promoções Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m "Reserva oferta de mercado"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort || true
              sleep $((attempt * 2))
            done
            exit 1
          fi

      - name: Publicar a oferta de mercado
        run: npm run publish-reserved

      - name: Confirmar publicação
        run: |
          git config user.name "Diegola Promoções Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m "Confirma publicação de mercado"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort || true
              sleep $((attempt * 2))
            done
            exit 1
          fi
