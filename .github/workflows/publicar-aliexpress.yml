name: Publicar AliExpress

# Quatro ofertas por rodada no tópico "AliExpress" do grupo, no mesmo volume da Shopee.
# Quem dispara é o cron-job.org, a cada 15 minutos (o agendamento do GitHub não roda aqui).
# O tópico é criado sozinho na primeira execução.
on:
  workflow_dispatch:

concurrency:
  group: publicar-aliexpress
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Publicar no Telegram
        run: |
          publicadas=0
          for rodada in 1 2 3 4; do
            if node src/aliexpress.mjs --publish; then publicadas=$((publicadas + 1)); else break; fi
            sleep 4
          done
          echo "Ofertas publicadas: $publicadas"
          [ "$publicadas" -gt 0 ]
        env:
          ALIEXPRESS_APP_KEY: "553330"
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Salvar histórico e feed
        if: always()
        run: |
          git config user.name "Diegola Promoções Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m "Publica oferta AliExpress"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort || true
              sleep $((attempt * 2))
            done
            exit 1
          fi
